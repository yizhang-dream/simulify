<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulify · 交互实验台画廊</title>
  <link rel="icon" href="./assets/logo.svg">
  <link rel="stylesheet" href="./kit/primer-tokens.css">
  <link rel="stylesheet" href="examples/gallery.css">
</head>
<body>
  <main class="gallery">
    <header class="gallery-head">
      <p>Simulify 3.1</p>
      <h1>交互实验台画廊</h1>
      <p>剖开差速器，或在损失曲面上拖动起点，观察条件改变后会发生什么。</p>
    </header>
    <div class="gallery-grid">
      <a class="gallery-card" href="examples/open-differential/index.html">
        <img src="examples/thumbs/open-differential.png" width="1388" height="576" alt="开放式差速器剖面，右侧车轮压在蓝色冰面上">
        <div class="gallery-card-body">
          <h2>开放式差速器 <span aria-hidden="true">↗</span></h2>
          <p>弯道中两轮可以不同速。右轮上冰后，抓地轮也只分到打滑侧所能承受的扭矩。</p>
          <ul aria-label="Profile、Layout、Skin"><li>mechanical-3d</li><li>split-bench</li><li>paper-ink</li></ul>
        </div>
      </a>
      <a class="gallery-card" href="examples/momentum-valley/index.html">
        <img src="examples/thumbs/momentum-valley.png" width="1440" height="900" alt="损失峡谷中的橙色动量轨迹和浅蓝色梯度下降轨迹">
        <div class="gallery-card-body">
          <h2>梯度下降与动量 <span aria-hidden="true">↗</span></h2>
          <p>比较病态峡谷中的两条轨迹，观察横向锯齿，以及步长越过稳定上限后如何发散。</p>
          <ul aria-label="Profile、Layout、Skin"><li>field-math</li><li>fullbleed-hud</li><li>dark-studio</li></ul>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
