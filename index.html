<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulify v2 · True 4D 交互原理与实验台画廊</title>
  <link rel="stylesheet" href="./kit/primer-tokens.css">
  <style>
    body {
      padding: 24px clamp(16px, 4vw, 48px);
      background-color: var(--bg);
      background-image: radial-gradient(#cbbda8 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .gallery-shell {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .gallery-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--card-solid);
      box-shadow: var(--shadow-md);
    }
    .gallery-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }
    .world-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--card-solid);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .world-card.is-flagship {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(320px, 1.15fr) minmax(300px, 1fr);
      border-color: var(--teal);
    }
    @media (max-width: 760px) {
      .world-card.is-flagship {
        grid-template-columns: 1fr;
      }
    }
    .world-thumb {
      width: 100%;
      height: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-bottom: 1px solid var(--line-soft);
      background: var(--bg-deep);
    }
    .world-card.is-flagship .world-thumb {
      border-bottom: 0;
      border-right: 1px solid var(--line-soft);
    }
    @media (max-width: 760px) {
      .world-card.is-flagship .world-thumb {
        border-right: 0;
        border-bottom: 1px solid var(--line-soft);
      }
    }
    .world-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      justify-content: center;
    }
    .world-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .world-tag {
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fffdf8;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--navy);
    }
    .world-tag.is-accent {
      border-color: var(--teal);
      background: var(--teal-soft);
      color: var(--navy);
      font-weight: 600;
    }
    .world-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .world-actions a {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      border: 1px dashed var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 253, 248, 0.72);
      font-size: 12.5px;
      color: var(--muted);
    }
    .gallery-foot a {
      color: var(--navy);
      font-family: var(--font-mono);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="gallery-shell">
    <header class="gallery-head">
      <div>
        <h1 class="brand-title" id="gal-title">Simulify v2 · True 4D 交互原理与实验台画廊</h1>
        <p class="brand-sub" id="gal-sub">连续 4D 渐进揭幕 · WebGPU + HTML-in-Canvas · MP4/WebM/GIF 确定性导出 · 离线零 CDN</p>
      </div>
      <div class="gallery-tools">
        <div id="mastery-slot"></div>
        <div id="lang-slot"></div>
        <button type="button" id="btn-search" class="btn-chip">⌘K 搜索</button>
      </div>
    </header>

    <main class="gallery-grid" id="gallery-grid"></main>

    <footer class="gallery-foot" id="gallery-foot">
      <span id="foot-note">早期 v1 归档实验台（保留完整 git 历史与离线可运行代码）：</span>
      <a href="./examples/archive/prob-stat-ch5-bench/index.html" id="foot-link">examples/archive/prob-stat-ch5-bench/</a>
    </footer>
  </div>

  <script type="module">
    import { mountLangSwitch, mountMasteryBar } from './shell/app-shell.js';
    import { CommandPalette } from './shell/command-palette.js';
    import { createI18n } from './shell/i18n.js';
    import { createLocalStorage, MasteryStore } from './shell/storage-adapter.js';

    const STAGES = [
      {
        id: 'rl-td-bench',
        flagship: true,
        href: './examples/rl-td-bench/index.html',
        deepQuery: 't=34&paused',
        thumb: './examples/thumbs/rl-td-bench.png',
        tags: {
          zh: ['v2 Flagship · True 4D', '6 节拍 · 44s 连续时间轴', 'WebGPU + HTML-in-Canvas', '3D 涂画悬崖', 'MP4 / GIF 导出'],
          en: ['v2 Flagship · True 4D', '6 Beats · 44s Continuous Clock', 'WebGPU + HTML-in-Canvas', '3D Cliff Brush', 'MP4 / GIF Export'],
        },
        title: {
          zh: 'RL 第 7 章 · TD / Sarsa / n-step / Q-Learning True 4D 旗舰实验台',
          en: 'RL Ch.7 · TD / Sarsa / n-step / Q-Learning True 4D Flagship Bench',
        },
        desc: {
          zh: '由 SpacetimeClock 与 ActorChoreographer 驱动的 44 秒连续 4D 渐进揭幕：从单步 TD(0) 脉冲、四向 Q 扇区下沉悬崖、3D 玻璃 n-step 视野弧，到同源 Sarsa 安全绕行 vs Q-Learning 贴崖虚影对照与 3D 活代码追踪；支持直接在 3D 棋盘涂画悬崖并一键导出 MP4 / WebM / GIF / APNG。',
          en: '44-second continuous 4D progressive reveal powered by SpacetimeClock & ActorChoreographer: single-step TD(0) wavefronts, sunken -100 cliff with 4-Q beveled tiles, translucent 3D n-step glass arc, live Sarsa vs counterfactual Ghost Q-Learning fork, diegetic 3D HTML-in-Canvas code trace, direct 3D cliff painting, and one-click MP4/WebM/GIF/APNG export.',
        },
      },
      {
        id: 'cache-bench',
        flagship: false,
        href: './examples/cache-bench/index.html',
        deepQuery: 'stage=act-4&end',
        thumb: './examples/thumbs/cache-bench.png',
        tags: {
          zh: ['逻辑 + 空间', '4 幕递进', 'XY 曲线 + Ghost', 'LiveMaths'],
          en: ['Logic + Space', '4 Progressive Acts', 'XY Curve + Ghost', 'LiveMaths'],
        },
        title: {
          zh: '双槽缓存淘汰实验台 · LRU vs FIFO',
          en: 'Dual-Bay Cache Workbench · LRU vs FIFO (4 Acts)',
        },
        desc: {
          zh: '同序列对照 1 ns SRAM 命中与 100 ns 主存回源，直观暴露 FIFO 误杀热点，实时刷新 XY 命中率曲线、Ghost 基准线与 AMAT 活公式代入。',
          en: '4 progressive acts comparing LRU vs FIFO on the same trace (1 ns SRAM vs 100 ns DRAM trays), LinkBus part-to-table highlighting, XY curves with ghost baseline, and live AMAT substitution.',
        },
      },
      {
        id: 'hysteresis-bench',
        flagship: false,
        href: './examples/hysteresis-bench/index.html',
        deepQuery: 'stage=act-3&end',
        thumb: './examples/thumbs/hysteresis-bench.png',
        tags: {
          zh: ['物理 × 数学', '3 幕对比', '相图滞回环', 'LiveMaths'],
          en: ['Physics × Math', '3-Act Contrast', 'Hysteresis Phase Loop', 'LiveMaths'],
        },
        title: {
          zh: '双金属恒温器 · 磁吸回差与防抖拆解',
          en: 'Bimetallic Thermostat · Hysteresis & Chatter Workbench',
        },
        desc: {
          zh: '铜钢异率膨胀弯曲配合永磁死区记忆历史状态；把回差压到 0° 即可在真实噪声下复现继电器高频火花抖动。',
          en: 'Bimetallic strip bends across temperature while a magnetic latch forms a 4 °C memory loop; collapse the band to 0 °C to expose relay chatter under noise.',
        },
      },
    ];

    const params = new URLSearchParams(location.search);
    const i18n = createI18n({
      defaultLang: params.get('lang') === 'en' ? 'en' : 'zh',
      dicts: {
        zh: {
          title: 'Simulify v2 · True 4D 交互原理与实验台画廊',
          sub: '连续 4D 渐进揭幕 · WebGPU + HTML-in-Canvas · MP4/WebM/GIF 确定性导出 · 离线零 CDN',
          enter: '打开实验台',
          deep: '直达反例 / 分叉现场',
          search: '⌘K 搜索',
          footNote: '早期 v1 归档实验台（保留完整 git 历史与离线可运行代码）：',
        },
        en: {
          title: 'Simulify v2 · True 4D Interactive Mechanism & Simulation Gallery',
          sub: 'True 4D Progressive Reveal · WebGPU + HTML-in-Canvas · Deterministic MP4/WebM/GIF Export · 100% Offline',
          enter: 'Open Workbench',
          deep: 'Jump to Fork / Counterexample',
          search: '⌘K Search',
          footNote: 'Archived v1 workbenches (preserved in git history and runnable standalone):',
        },
      },
    });

    const store = new MasteryStore(createLocalStorage('simulify:gallery:'), STAGES.map((w) => w.id));
    mountMasteryBar(document.getElementById('mastery-slot'), store, {
      labelFn: (p) => `${p.done}/${p.total}`,
    });
    mountLangSwitch(document.getElementById('lang-slot'), i18n, [
      { code: 'zh', label: '中文' },
      { code: 'en', label: 'EN' },
    ]);

    const palette = new CommandPalette({
      items: STAGES.map((w) => ({
        id: w.id,
        title: w.title.zh,
        subtitle: w.tags.zh.join(' · '),
        href: w.href,
      })),
      onSelect: (item) => {
        store.markDone(item.id);
        location.href = item.href;
      },
    });

    function render() {
      const lang = i18n.getLang();
      document.getElementById('gal-title').textContent = i18n.t('title');
      document.getElementById('gal-sub').textContent = i18n.t('sub');
      document.getElementById('btn-search').textContent = i18n.t('search');
      document.getElementById('foot-note').textContent = i18n.t('footNote');

      const grid = document.getElementById('gallery-grid');
      grid.replaceChildren();
      for (const w of STAGES) {
        const card = document.createElement('article');
        card.className = w.flagship ? 'world-card is-flagship' : 'world-card';

        const img = document.createElement('img');
        img.className = 'world-thumb';
        img.src = w.thumb;
        img.alt = w.title[lang] || w.title.zh;

        const body = document.createElement('div');
        body.className = 'world-body';

        const tags = document.createElement('div');
        tags.className = 'world-tags';
        const tagList = w.tags[lang] || w.tags.zh;
        tagList.forEach((tg, idx) => {
          const sp = document.createElement('span');
          sp.className = w.flagship && idx === 0 ? 'world-tag is-accent' : 'world-tag';
          sp.textContent = tg;
          tags.append(sp);
        });

        const h2 = document.createElement('h2');
        h2.textContent = w.title[lang] || w.title.zh;
        const p = document.createElement('p');
        p.className = 'guide-cue';
        p.textContent = w.desc[lang] || w.desc.zh;

        const actions = document.createElement('div');
        actions.className = 'world-actions';

        const aEnter = document.createElement('a');
        aEnter.className = 'btn-primary';
        aEnter.href = `${w.href}?lang=${lang}`;
        aEnter.textContent = i18n.t('enter');
        aEnter.onclick = () => store.markDone(w.id);

        const aDeep = document.createElement('a');
        aDeep.className = 'btn-secondary';
        aDeep.href = `${w.href}?${w.deepQuery}&lang=${lang}`;
        aDeep.textContent = i18n.t('deep');
        aDeep.onclick = () => store.markDone(w.id);

        actions.append(aEnter, aDeep);
        body.append(tags, h2, p, actions);
        card.append(img, body);
        grid.append(card);
      }
    }

    document.getElementById('btn-search').onclick = () => palette.open();
    i18n.subscribe(render);
    render();
    window.__simulify = { i18n, store };
    window.__ready = true;
  </script>
</body>
</html>
