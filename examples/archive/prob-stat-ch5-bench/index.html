<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulify · 概率论与数理统计第 5 章 · 5 幕精密实验台</title>
  <link rel="stylesheet" href="../../../kit/primer-tokens.css">
  <link rel="stylesheet" href="./prob.css">
  <script type="importmap">
  {
    "imports": {
      "three": "../../shared/vendor/three/three.module.js",
      "three/addons/": "../../shared/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div class="artboard-shell">
    <header class="top-ribbon" id="top-ribbon">
      <nav class="act-stepper" id="act-stepper" aria-label="第 5 章 5 幕导航"></nav>
      <div class="ribbon-tools" role="toolbar" focusgroup="toolbar wrap" aria-label="视角与辅助工具">
        <button type="button" id="view-top" class="tb-btn" aria-pressed="false" aria-label="俯视图"><span>俯视</span></button>
        <button type="button" id="view-reset" class="tb-btn" aria-label="复位相机"><span>复位</span></button>
        <button type="button" id="toggle-callouts" class="tb-btn" aria-pressed="true"><span>标注</span></button>
        <button type="button" id="toggle-sound" class="tb-btn" aria-pressed="false"><span>音效</span></button>
        <span id="lang-slot"></span>
        <button type="button" id="btn-palette" class="btn-chip" aria-label="命令面板 Ctrl+K">⌘K</button>
      </div>
    </header>

    <main class="stage-fullbleed" aria-label="概率仪器三联台">
      <canvas id="stage-canvas" class="stage-canvas" aria-label="三联仪器台：L² 投影、分布柱列与到达轨、高斯靶球"></canvas>
      <svg id="leader-svg" class="leader-svg" aria-hidden="true"></svg>
      <div id="tags-layer" class="tags-layer" aria-hidden="true"></div>
      <div id="popups-layer" class="popups-layer" aria-hidden="true"></div>
      <div id="stage-tooltip" class="stage-tooltip" role="tooltip" hidden></div>
    </main>

    <section class="thumb-dock" aria-label="移动端快捷控制">
      <div class="thumb-dock-row">
        <button type="button" id="mob-prev" class="btn-chip">上一幕</button>
        <button type="button" id="mob-play" class="btn-primary">播放</button>
        <button type="button" id="mob-next" class="btn-chip">下一幕</button>
      </div>
    </section>

    <aside class="right-dock" id="right-dock" aria-label="当前幕导学与参数">
      <div class="dock-header">
        <h2 id="act-title"></h2>
        <p id="act-cue" class="guide-cue"></p>
        <div class="question-chain" id="question-chain">
          <div class="qc-carries" id="txt-carries"></div>
          <div class="qc-hook" id="txt-hook"></div>
          <div class="qc-relates" id="txt-relates"></div>
        </div>
      </div>

      <div class="dock-controls" id="controls-slot"></div>

      <div class="hud-pill" id="hud-pill" data-tone="teal">
        <span id="pill-label">结果</span>
        <strong id="pill-value" class="mono">—</strong>
      </div>

      <div class="inspector-grid" id="inspector-grid"></div>

      <div class="dock-foot">
        <span id="readout-left" class="mono"></span>
        <span id="readout-right" class="mono"></span>
      </div>
      <div id="mastery-slot"></div>
    </aside>

    <div class="bottom-left-dock" id="bottom-left-dock">
      <section id="chart-card" aria-label="分布曲线与对照基准"></section>
      <div id="live-maths-slot"></div>
    </div>

    <div class="bottom-transport" id="bottom-transport">
      <div id="timeline-slot"></div>
    </div>

    <p id="status-bar" class="visually-hidden" role="status"></p>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
