<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulify · 双金属恒温器磁吸回差实验台</title>
  <link rel="stylesheet" href="../../kit/primer-tokens.css">
  <script type="importmap">
  {
    "imports": {
      "three": "../shared/vendor/three/three.module.js",
      "three/addons/": "../shared/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div class="artboard-shell">
    <header class="hud-top-left">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title" id="brand-title">双金属恒温器 · 磁吸回差实验台</h1>
          <p class="brand-sub" id="brand-sub">铜钢形变 × 永磁死区 × 滞回环 · 单一 solve() 驱动</p>
        </div>
      </div>

      <div class="hud-status-row">
        <div id="heater-pill" class="latency-pill">
          <span id="heater-pill-label">加热关闭</span>
          <span id="heater-pill-temp" class="mono">20.0 °C</span>
        </div>
        <div id="lang-slot"></div>
        <button type="button" id="btn-palette" class="btn-chip" aria-label="打开命令搜索 (Ctrl+K)">⌘K 搜索</button>
      </div>
    </header>

    <main class="stage-fullbleed" aria-label="三维恒温器工作台">
      <canvas id="stage-canvas" class="stage-canvas" aria-label="三维双金属恒温器：旋转、缩放或点击部件聚焦检查"></canvas>
      <svg id="leader-svg" class="leader-svg" aria-hidden="true"></svg>
      <div id="tags-layer" class="tags-layer" aria-hidden="true"></div>
      <div id="popups-layer" class="popups-layer" aria-hidden="true"></div>
      <div id="stage-tooltip" class="stage-tooltip" role="tooltip" hidden></div>
    </main>

    <section class="thumb-dock" aria-label="移动端快捷调温">
      <div class="thumb-dock-row">
        <button type="button" id="thumb-down" class="btn-chip">-1 °C</button>
        <button type="button" id="thumb-up" class="btn-chip">+1 °C</button>
        <button type="button" id="thumb-band" class="btn-primary">切换回差</button>
      </div>
    </section>

    <aside class="hud-guide" id="hud-guide" aria-label="当前幕引导">
      <div>
        <h2 id="lesson-title"></h2>
        <p id="lesson-cue" class="guide-cue"></p>
        <div class="question-chain">
          <div class="qc-carries" id="qc-carries" hidden></div>
          <div class="qc-hook" id="qc-hook" hidden></div>
        </div>
      </div>

      <div id="prediction-box" class="prediction-box" hidden>
        <p id="prediction-prompt"></p>
        <div id="prediction-choices" class="prediction-choices"></div>
        <div id="prediction-verdict" class="verdict-box" hidden></div>
      </div>

      <div class="guide-section">
        <div class="range-wrap">
          <div class="range-head">
            <label for="temp-range" class="temp-big" id="temp-reading">20.0 °C</label>
            <span id="heater-badge" class="heater-badge" data-on="false">加热关闭</span>
          </div>
          <input type="range" id="temp-range" min="16" max="24" step="0.5" value="20" aria-label="室温滑杆">
          <div class="range-ticks"><span>16°</span><span>18° 开</span><span>20°</span><span>22° 关</span><span>24°</span></div>
        </div>

        <div class="playback-row">
          <button type="button" id="band-4" class="btn-chip" aria-pressed="true">有回差 4°</button>
          <button type="button" id="band-0" class="btn-chip" aria-pressed="false">无回差 0°</button>
          <button type="button" id="btn-down" class="btn-secondary">-1°</button>
          <button type="button" id="btn-up" class="btn-secondary">+1°</button>
        </div>
      </div>

      <div class="guide-readout">
        <span id="readout-rule">死区延续</span>
        <span id="readout-switches">动作: 0 次</span>
      </div>
    </aside>

    <div class="hud-bottom-left" id="hud-bottom-left">
      <section id="chart-card" aria-label="温度与开关滞回曲线"></section>
      <div id="live-maths-slot"></div>
      <section id="inspector-float" class="inspector-float" hidden aria-label="部件详情">
        <div class="inspector-head">
          <span id="inspector-title" class="inspector-title">部件</span>
          <button type="button" id="inspector-zoom" class="inspector-close">聚焦</button>
          <button type="button" id="inspector-close" class="inspector-close" aria-label="关闭检查器">×</button>
        </div>
        <p id="inspector-note"></p>
      </section>
    </div>

    <div class="hud-bottom-center" id="hud-bottom-center">
      <div id="timeline-slot"></div>
      <div class="viewbar" role="toolbar" focusgroup="toolbar wrap" aria-label="三维视角与工具">
        <div role="group" aria-label="相机">
          <button type="button" id="view-left" class="tb-btn" aria-label="左转 (Q)">↺</button>
          <button type="button" id="view-right" class="tb-btn" aria-label="右转 (E)">↻</button>
          <button type="button" id="view-top" class="tb-btn" aria-pressed="false"><span>俯视</span></button>
          <button type="button" id="view-reset" class="tb-btn"><span>复位</span></button>
        </div>
        <span role="separator" aria-orientation="vertical" class="tb-sep"></span>
        <div role="group" aria-label="标注与声音">
          <button type="button" id="toggle-callouts" class="tb-btn" aria-pressed="true"><span>标注</span></button>
          <button type="button" id="toggle-sound" class="tb-btn" aria-pressed="true"><span>音效</span></button>
        </div>
      </div>
    </div>

    <p id="status-bar" class="visually-hidden" role="status"></p>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
