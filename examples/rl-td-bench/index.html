<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulify v2 · RL 时序差分 4D 渐进式实验台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318213d'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='monospace' font-weight='800' font-size='14' fill='%23f6eddd'%3ETD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../kit/primer-tokens.css">
  <link rel="stylesheet" href="./rl-bench.css">
  <script type="importmap">
  {
    "imports": {
      "three": "../shared/vendor/three/three.webgpu.js",
      "three/addons/": "../shared/vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div class="artboard-shell">
    <!-- Minimal Top Title & Interactive Control Strip (Chrome) -->
    <header class="top-ribbon" id="top-ribbon" data-export-role="chrome">
      <div class="ribbon-brand">
        <span class="ribbon-mark" aria-hidden="true">TD</span>
        <h1 class="ribbon-title" id="brand-title">RL 第 7 章 · 时序差分 4D 实验台</h1>
        <span class="ribbon-beat-chip" id="beat-chip">1/6</span>
      </div>

      <div class="ribbon-controls">
        <button type="button" id="btn-paint-cliff" class="brush-toggle" aria-pressed="false" title="开启后可在 3D 网格上直接涂画或擦除悬崖（也可按住 Alt 拖拽）">
          <span aria-hidden="true">🖌</span>
          <span id="lbl-paint-cliff">涂画悬崖</span>
        </button>
        <button type="button" id="btn-reset-cliff" class="brush-reset-btn" hidden>重置悬崖</button>

        <div class="param-pills">
          <div class="param-pill">
            <span>ε=<strong id="val-eps">0.10</strong></span>
            <button type="button" id="eps-dec" aria-label="减小 ε">-</button>
            <button type="button" id="eps-inc" aria-label="增大 ε">+</button>
          </div>
          <div class="param-pill">
            <span>α=<strong id="val-alpha">0.50</strong></span>
            <button type="button" id="alpha-dec" aria-label="减小 α">-</button>
            <button type="button" id="alpha-inc" aria-label="增大 α">+</button>
          </div>
          <div class="param-pill">
            <span>n=<strong id="val-n">4</strong></span>
            <button type="button" id="n-dec" aria-label="减小 n-step">-</button>
            <button type="button" id="n-inc" aria-label="增大 n-step">+</button>
          </div>
        </div>

        <div id="lang-slot"></div>
        <button type="button" id="btn-palette" class="btn-chip" aria-label="命令面板 Ctrl+K">⌘K</button>
      </div>
    </header>

    <!-- Airy Floating Beat Narrative Caption (Caption Role) -->
    <section class="beat-caption-pill" id="beat-caption-pill" data-export-role="caption" aria-live="polite">
      <div class="beat-caption-head">
        <h2 class="beat-caption-title" id="act-title">第 1 幕 · 初探网格与终点奖励</h2>
        <span class="beat-ep-tag" id="beat-ep-tag" hidden>ep 0</span>
      </div>
      <p class="beat-caption-cue" id="act-cue"></p>
      <div class="brush-banner" id="brush-banner" hidden>涂画模式：在 3D 棋盘上点击或拖拽涂画 / 擦除 -100 悬崖（按住 Alt 随时快涂）</div>
    </section>

    <!-- Full-Bleed WebGPU / WebGL2 3D Stage -->
    <main class="stage-fullbleed" data-export-role="stage" aria-label="3D 强化学习悬崖行走渐进实验台">
      <canvas id="stage-canvas" class="stage-canvas" aria-label="强化学习第 7 章 4D 悬崖行走舞台"></canvas>
      <svg id="leader-svg" class="leader-svg" data-export-role="callout" aria-hidden="true"></svg>
      <div id="tags-layer" class="tags-layer" data-export-role="callout" aria-hidden="true"></div>
      <div id="popups-layer" class="popups-layer" data-export-role="callout" aria-hidden="true"></div>
      <div id="stage-tooltip" class="stage-tooltip" data-export-role="chrome" role="tooltip" hidden></div>
    </main>

    <!-- Mobile Thumb Dock -->
    <section class="thumb-dock" data-export-role="chrome" aria-label="移动端快捷控制">
      <div class="thumb-dock-row">
        <button type="button" id="mob-prev" class="btn-chip">上一幕</button>
        <button type="button" id="mob-play" class="btn-primary">播放</button>
        <button type="button" id="mob-next" class="btn-chip">下一幕</button>
        <button type="button" id="mob-paint" class="btn-secondary">🖌 涂画悬崖</button>
      </div>
    </section>

    <!-- Progressive Contextual Right Dock (HIDDEN at t=0, revealed by ActorChoreographer at Beat 2) -->
    <aside class="right-dock hud-reveal" id="right-dock" data-export-role="panel" data-hud-hidden="true" hidden aria-label="渐进式公式与策略分叉面板">
      <div id="td-maths-slot"></div>
      <div id="fork-panel-slot" hidden></div>
      <div id="unified-slot" class="unified-panel" hidden>
        <div class="unified-panel-head">
          <strong id="unified-title">统一 TD 更新模板</strong>
          <span class="beat-ep-tag" id="unified-badge">Target</span>
        </div>
        <div class="unified-tabs" id="unified-tabs" role="group" aria-label="切换 TD 目标算法">
          <button type="button" class="unified-tab" data-method="td0" aria-pressed="false">TD(0) · V(S')</button>
          <button type="button" class="unified-tab" data-method="sarsa" aria-pressed="false">Sarsa · Q(S',A')</button>
          <button type="button" class="unified-tab" data-method="nstep" aria-pressed="false">n-step · G_{t:t+n}</button>
          <button type="button" class="unified-tab" data-method="qlearn" aria-pressed="true">Q-learn · max Q</button>
        </div>
        <div class="unified-note" id="unified-note"></div>
        <div class="ghost-diff-badge" id="ghost-diff-badge" hidden></div>
      </div>

      <div class="cell-inspector" id="cell-inspector" hidden>
        <div class="cell-inspector-head">
          <span id="inspect-cell-title">格子 (2, 3) · 四向 Q 值</span>
          <button type="button" id="btn-zoom-cell" class="btn-chip">聚焦格</button>
        </div>
        <div class="cell-q-grid" id="cell-q-grid"></div>
      </div>
    </aside>

    <!-- Progressive Bottom-Left ChartCard (HIDDEN at t=0, revealed by ActorChoreographer at Beat 4) -->
    <div class="bottom-left-dock hud-reveal" id="bottom-left-dock" data-export-role="panel" data-hud-hidden="true" hidden>
      <section id="chart-card" aria-label="实时收敛与回报对照图"></section>
    </div>

    <!-- Mobile Responsive Fallback Slot for Code Trace -->
    <div class="mobile-code-slot" id="mobile-code-slot" data-export-role="panel"></div>

    <!-- Always-Present Sleek Bottom 4D Timeline & Export Bar -->
    <div class="bottom-transport" id="bottom-transport" data-export-role="chrome" role="toolbar" aria-label="4D 时间轴与导出">
      <div class="timeline-bar-slot" id="timeline-bar-slot"></div>
      <div class="transport-tools" id="transport-tools">
        <button type="button" id="view-top" class="tb-btn" aria-pressed="false">俯视</button>
        <button type="button" id="view-reset" class="tb-btn">复位</button>
        <span id="export-btn-slot"></span>
      </div>
    </div>

    <p id="status-bar" class="visually-hidden" role="status"></p>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
